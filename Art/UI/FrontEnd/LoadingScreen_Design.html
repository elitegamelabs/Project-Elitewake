<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131a">
  <title>Elitewake — Setting Sail</title>
  <style>
    :root {
      color-scheme: dark;
      --cream: #eee7d7;
      --muted: #bebeb5;
      --gold: #dab780;
      --gold-light: #f1d8a8;
      --line: rgba(238, 231, 215, .28);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      background: #07131a;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }
    .screen { position: relative; width: 100%; height: 100svh; min-height: 550px; isolation: isolate; }
    .scene {
      position: absolute; inset: -1.7%; width: 103.4%; height: 103.4%;
      object-fit: cover; object-position: 57% 52%; z-index: -3;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .shade {
      position: absolute; inset: 0; z-index: -2;
      background:
        linear-gradient(90deg, rgba(5, 15, 22, .82) 0%, rgba(5, 15, 22, .56) 34%, rgba(5, 15, 22, .04) 75%),
        linear-gradient(0deg, rgba(3, 11, 17, .88) 0%, rgba(3, 11, 17, .08) 36%, rgba(3, 11, 17, .18) 100%);
    }
    .frame { position: absolute; inset: 28px; border: 1px solid rgba(245, 223, 186, .24); pointer-events: none; }
    .frame::before, .frame::after { content: ""; position: absolute; width: 29px; height: 29px; border-color: rgba(245, 223, 186, .56); }
    .frame::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .frame::after { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }
    .content {
      position: absolute; top: clamp(72px, 13vh, 150px); left: clamp(48px, 7.1vw, 144px);
      width: min(700px, 56vw); text-shadow: 0 2px 18px rgba(0, 0, 0, .5);
    }
    .brand { display: flex; align-items: center; gap: 17px; margin-bottom: clamp(48px, 9vh, 98px); }
    .brand-mark { width: 32px; height: 32px; position: relative; transform: rotate(45deg); border: 1px solid var(--gold); }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; background: var(--gold); }
    .brand-mark::before { width: 1px; top: -9px; bottom: -9px; left: 15px; }
    .brand-mark::after { height: 1px; left: -9px; right: -9px; top: 15px; }
    .brand-name { font-size: clamp(22px, 2.3vw, 34px); letter-spacing: .2em; line-height: 1; }
    .eyebrow { display: flex; align-items: center; gap: 16px; color: var(--gold-light); font: 600 11px/1.4 Arial, sans-serif; letter-spacing: .36em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 36px; height: 1px; background: var(--gold); }
    h1 { margin: 22px 0 20px; font-size: clamp(49px, 5.8vw, 104px); line-height: .99; font-weight: 400; letter-spacing: -.042em; }
    h1 em { font-style: normal; color: var(--gold-light); }
    .lead { max-width: 560px; margin: 0; color: #e8e8e2; font: 18px/1.65 Arial, sans-serif; letter-spacing: .02em; }
    .lower {
      position: absolute; left: clamp(48px, 7.1vw, 144px); right: clamp(48px, 7.1vw, 144px);
      bottom: clamp(55px, 8vh, 105px); display: flex; align-items: end; gap: 50px;
    }
    .loading { width: min(520px, 58vw); }
    .loading-head { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 15px; }
    .loading-label { color: var(--gold-light); font: 600 11px/1.3 Arial, sans-serif; letter-spacing: .31em; text-transform: uppercase; }
    .loading-value { color: var(--muted); font: 12px/1 Arial, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    .track { position: relative; width: 100%; height: 3px; overflow: hidden; background: rgba(246, 235, 214, .24); }
    .fill { position: absolute; top: 0; left: 0; width: 34%; height: 100%; background: linear-gradient(90deg, transparent, var(--gold-light), #fff3d7); box-shadow: 0 0 16px var(--gold); animation: passage 2.5s ease-in-out infinite; }
    .track.determinate .fill { animation: none; width: 0; transition: width .3s ease; }
    .loading-note { margin: 13px 0 0; color: #d2d0c9; font: 12px/1.5 Arial, sans-serif; letter-spacing: .03em; }
    .chapter { margin-left: auto; text-align: right; color: #e6ddcd; font: 11px/1.6 Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    .chapter strong { display: block; color: var(--gold-light); font-weight: 600; letter-spacing: .32em; }
    @keyframes passage { from { transform: translateX(-110%); } to { transform: translateX(300%); } }
    @keyframes drift { from { transform: scale(1); } to { transform: scale(1.03); } }
    @media (max-width: 760px) {
      .screen { min-height: 480px; }
      .scene { object-position: 64% 50%; }
      .shade { background: linear-gradient(90deg, rgba(5,15,22,.84), rgba(5,15,22,.34)), linear-gradient(0deg, rgba(3,11,17,.9), transparent 50%); }
      .frame { inset: 16px; }
      .content { left: 42px; top: 58px; width: calc(100% - 82px); }
      .brand { margin-bottom: clamp(38px, 8vh, 78px); }
      h1 { font-size: clamp(46px, 10vw, 76px); }
      .lead { font-size: 15px; max-width: 390px; }
      .lower { left: 42px; right: 42px; bottom: 45px; }
      .loading { width: 100%; }
      .chapter { display: none; }
    }
    @media (max-height: 640px) and (min-width: 761px) {
      .content { top: 55px; }
      .brand { margin-bottom: 31px; }
      h1 { font-size: clamp(42px, 5vw, 75px); }
      .lower { bottom: 49px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene, .fill { animation: none; }
      .fill { width: 100%; background: linear-gradient(90deg, rgba(218,183,128,.15), var(--gold-light)); }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Elitewake loading screen">
    <img class="scene" src="voyage.png" alt="A survivor's ship sails into open sea beneath storm clouds and sunrise">
    <div class="shade" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>
    <section class="content">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">ELITEWAKE</span></div>
      <div class="eyebrow">Your voyage begins</div>
      <h1>Beyond the<br><em>horizon.</em></h1>
      <p class="lead">The open seas await. Find your course, make your name, and face the peril between you and glory.</p>
    </section>
    <footer class="lower">
      <div class="loading">
        <div class="loading-head"><span class="loading-label" id="status">Preparing your world</span><span class="loading-value" id="value">PLEASE WAIT</span></div>
        <div class="track" id="track" role="progressbar" aria-label="World loading"><span class="fill" id="fill"></span></div>
        <p class="loading-note">Your journey will begin as soon as the world is ready.</p>
      </div>
      <div class="chapter"><strong>Peril &amp; glory await</strong>On the open seas</div>
    </footer>
  </main>
  <script>
    // The host game may call these methods when it has real loading state.
    // Without a host signal, the indicator remains indeterminate and never claims completion.
    window.ElitewakeLoadingScreen = Object.freeze({
      setProgress(fraction) {
        if (!Number.isFinite(fraction)) return;
        const value = Math.max(0, Math.min(1, fraction));
        const percent = Math.round(value * 100);
        const track = document.getElementById('track');
        track.classList.add('determinate');
        track.setAttribute('aria-valuenow', String(percent));
        track.setAttribute('aria-valuemin', '0');
        track.setAttribute('aria-valuemax', '100');
        document.getElementById('fill').style.width = `${percent}%`;
        document.getElementById('value').textContent = `${percent}%`;
      },
      setReady() {
        this.setProgress(1);
        document.getElementById('status').textContent = 'Your world is ready';
      }
    });
  </script>
</body>
</html>
